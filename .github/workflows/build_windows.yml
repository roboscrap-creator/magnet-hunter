name: Build MagnetHunter Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Gerar estrutura Windows
        run: flutter create --platforms=windows --org com.roboscrap.hunter .
      - name: Baixar pacotes e gerar symlinks
        run: flutter pub get
      - name: Configurar flag STL1011 no CMakeLists raiz e do plugin
        shell: pwsh
        run: |
          $rootCmake = Get-Content "windows\CMakeLists.txt"
          Set-Content "windows\CMakeLists.txt" -Value (@("add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)") + $rootCmake)
          $pluginCmake = "windows\flutter\ephemeral\.plugin_symlinks\webview_windows\windows\CMakeLists.txt"
          if (Test-Path $pluginCmake) {
            Add-Content -Path $pluginCmake -Value "`ntarget_compile_definitions(`${PLUGIN_NAME} PRIVATE _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
          }
      - name: Compilar Windows Release
        run: flutter build windows --release
      - name: Compactar pasta Release do Windows
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath MagnetHunter-Windows.zip
      - name: Disponibilizar EXE para Download
        uses: actions/upload-artifact@v4
        with:
          name: MagnetHunter-Windows
          path: MagnetHunter-Windows.zip

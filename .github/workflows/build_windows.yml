name: Build MagnetHunter Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Gerar estrutura Windows
        run: flutter create --platforms=windows --org com.roboscrap.hunter .
      - name: Baixar pacotes
        run: flutter pub get
      - name: Compilar Windows Release
        run: flutter build windows --release
      - name: Compactar pasta Release do Windows
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath MagnetHunter-Windows.zip
      - name: Disponibilizar EXE para Download
        uses: actions/upload-artifact@v4
        with:
          name: MagnetHunter-Windows
          path: MagnetHunter-Windows.zip

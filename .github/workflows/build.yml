name: Build MagnetHunter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Gerar estrutura Android
        run: |
          flutter create --platforms=android --org com.roboscrap.hunter . && rm -rf test/
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Baixar pacotes
        run: flutter pub get
      - name: Analisar codigo Dart
        run: flutter analyze --no-fatal-infos
      - name: Compilar APK Release
        run: flutter build apk --release
      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: MagnetHunter-APK
          path: build/app/outputs/flutter-apk/app-release.apk
